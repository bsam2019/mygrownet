<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#14100e">
    <title>Offline — GrowStream</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: #14100e;
            color: #f4ede9;
            font-family: 'Be Vietnam Pro', system-ui, sans-serif;
            display: flex; align-items: center; justify-content: center;
            padding: 1.5rem; text-align: center;
        }
        .card { max-width: 420px; }
        .icon {
            width: 88px; height: 88px; margin: 0 auto 1.75rem;
            border-radius: 50%; background: #2b231f;
            display: flex; align-items: center; justify-content: center;
        }
        .icon svg { width: 44px; height: 44px; stroke: #e2571f; }
        h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.75rem; font-weight: 800; margin-bottom: .75rem; }
        p { color: #d8c2bc; line-height: 1.6; font-size: .95rem; margin-bottom: 2rem; }
        a {
            display: inline-block; background: #e2571f; color: #fff;
            padding: .8rem 2rem; border-radius: 9999px; text-decoration: none;
            font-weight: 600; font-size: .9rem;
        }
        a:hover { background: #c94918; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
        </div>
        <h1>You're offline</h1>
        <p>Check your connection and try again. Your watch history and progress are saved — you'll pick up right where you left off.</p>
        <a href="/">Try Again</a>
    </div>
</body>
</html>
